# Prerequisites:
#   ! keep the below line updated! It's parsed and used for dependency installation by shared GitHub Workflow
#   brew install yamlfmt yamllint actionlint markdownlint-cli2 shellcheck shfmt checkov trivy go buf gci golangci-lint
#
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

default_stages: [pre-commit, pre-push]
# fail_fast: false
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
            exclude: testdata/plans/.*\.txt$
          - id: check-yaml
          - id: check-toml
          - id: check-merge-conflict
          - id: check-added-large-files
          - id: detect-private-key
          - id: pretty-format-json
            args: [--no-sort-keys, --autofix]
          - id: no-commit-to-branch
            args: [--branch, master]

    - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt.git
      rev: 8d1b9cadaf854cb25bb0b0f5870e1cc66a083d6b  # frozen: 0.2.3
      hooks:
          - id: yamlfmt

    - repo: https://github.com/detailyang/pre-commit-shell.git
      rev: 062f0b028ae65827e04f91c1e6738cfcbe9b337f  # frozen: 1.0.5
      hooks:
          - id: shell-lint

    - repo: local
      hooks:
          - id: go_tools
            name: Install go tools
            entry: make install-tools
            language: system
            pass_filenames: false
            stages: [manual]

          - id: gci
            name: Fix imports and Format go code
            entry: make fmt gci
            language: system
            pass_filenames: false

          - id: go_lint
            name: Run lint
            entry: make lint
            language: system
            pass_filenames: false

          - id: go_test
            name: Run tests
            entry: make test
            language: system
            pass_filenames: false

    - repo: https://github.com/jumanjihouse/pre-commit-hooks.git
      rev: 38980559e3a605691d6579f96222c30778e5a69e  # frozen: 3.0.0
      hooks:
          - id: markdownlint
